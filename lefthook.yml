
pre-commit:
  parallel: false
  jobs:
    - name: fmt
      glob: "*.rs"
      run: cargo fmt --all
      stage_fixed: true

    - name: clippy
      glob: "*.rs"
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: rumdl
      glob: "*.md"
      run: rumdl fmt {staged_files}
      stage_fixed: true

