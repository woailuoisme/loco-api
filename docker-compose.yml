x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: loco:local
  pull_policy: build
  restart: unless-stopped
  env_file:
    - path: .env.production
  networks:
    - backend
  volumes:
    - ./storages:/app/storages

services:
  api:
    <<: *app
    container_name: api
    command: ["start", "--no-banner"]
    ports:
      - "5150:5150"

  worker:
    <<: *app
    container_name: worker
    command: ["start", "--worker"]

  scheduler:
    <<: *app
    container_name: scheduler
    command: ["scheduler"]

networks:
  backend:
    external: true
