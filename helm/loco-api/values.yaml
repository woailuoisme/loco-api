# Default values for loco-api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: docker.cnb.cool/ailuoga/loco-api
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion (ignored when digest is set).
  tag: ""
  # Image digest in format algorithm:hash (takes precedence over tag when set).
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# -- Main API Web Service
service:
  type: ClusterIP
  port: 5150
  targetPort: 5150
  portName: http

# -- Loco built-in health check probe endpoints
livenessProbe:
  httpGet:
    path: /_health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /_readiness
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

startupProbe:
  httpGet:
    path: /_ping
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 12

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: loco-api.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: loco-api-tls
  #    hosts:
  #      - loco-api.local

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# -- Background queue worker deployment (runs `locos start --worker`)
worker:
  enabled: false
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# -- Cron scheduler deployment (runs `locos start --scheduler`)
scheduler:
  enabled: false
  replicaCount: 1
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 20m
      memory: 32Mi

# -- ConfigMap for non-sensitive Loco environment variables
configMap:
  enabled: true
  data:
    LOCO_ENV: "production"
    PORT: "5150"
    BINDING: "0.0.0.0"
    LOG_LEVEL: "info"
    HOST: "http://localhost:5150"

# -- Secret for sensitive Loco environment variables
secret:
  enabled: true
  type: Opaque
  stringData:
    DB_URL: "postgres://postgres:password@postgres:5432/loco_api_production"
    REDIS_URL: "redis://:redis_secret@valkey:6379"
    JWT_SECRET: "change-this-to-a-secure-random-jwt-secret-in-production"
    MAIL_HOST: "mailpit"
    MAIL_PORT: "1025"
    MAIL_USERNAME: "mailpit"
    MAIL_PASSWORD: "mailpit"

# -- Additional direct environment variables
env: []

# -- Additional environment variable sources
envFrom: []

# -- Volume mounts
volumeMounts: []

# -- Volumes
volumes: []

nodeSelector: {}
tolerations: []
affinity: {}
