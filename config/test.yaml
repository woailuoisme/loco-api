# Loco 应用测试环境配置文件 (test.yaml)

# 1. 日志配置 (测试时关闭输出以保持控制台清爽)
logger:
  enable: false
  pretty_backtrace: false
  level: debug
  format: compact
  file_appender:
    enable: false
    non_blocking: true
    level: debug
    format: compact
    rotation: daily
    dir: ./storages/logs
    filename_prefix: loco-api
    filename_suffix: log
    max_log_files: 7

# 2. Web 服务配置
server:
  port: 5150
  host: http://localhost
  ident: ""
  middlewares:

# 3. 后台任务模式 (测试必须同步阻塞完成)
workers:
  mode: ForegroundBlocking

# 4. 邮件服务配置 (Stub 内存投递，零外部网络依赖)
mailer:
  stub: true
  smtp:
    enable: true
    host: localhost
    port: 1025
    secure: false

# 5. 对象存储配置 (本地文件存储，隔离外部 S3)
storage:
  kind: Local

# 6. 数据库配置
database:
  uri: <%= get_env(name="DB_URL_TEST", default="postgres://postgres:598f18a1c99d539ced6631add2b428b3@127.0.0.1:5432/loco_api_test") %>
  enable_logging: false
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="500") %>
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="500") %>
  min_connections: <%= get_env(name="DB_MIN_CONNECTIONS", default="1") %>
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="1") %>
  auto_migrate: true
  dangerously_truncate: true

# 7. 身份认证与安全配置
auth:
  jwt:
    secret: <%= get_env(name="JWT_SECRET", default="JrpYhwuDmrP0LuVeg9PVtest_secret_for_unit_tests") %>
    expiration: 604800

# 8. 缓存配置 (InMem 纯内存缓存，零 Redis 依赖)
cache:
  kind: InMem

# 9. 测试应用设置桩
settings:
  oauth2:
    google:
      client_id: test_client_id
      client_secret: test_client_secret
  media:
    driver: direct
    base_url: "http://localhost:5150/v1/files"
  telegram:
    bot_token: ""
    api_url: "https://api.telegram.org"
  scout:
    meilisearch:
      host: "http://localhost:7700"
      prefix: "loco_test_"
  system:
    machine_id: 1
  centrifugo:
    api_endpoint: "http://localhost:8000/api"
    api_key: "test_centrifugo_api_key"
    token_hmac_secret: "test_centrifugo_token_hmac_secret_for_tests"
    token_audience: "centrifugo"
    ws_url: "ws://localhost:8000/connection/websocket"
    token_ttl_secs: 3600
  opentelemetry:
    enabled: <%= get_env(name="OTEL_ENABLED", default="false") %>
    endpoint: "<%= get_env(name='OTEL_EXPORTER_OTLP_ENDPOINT', default='http://127.0.0.1:4318') %>"
    service_name: "<%= get_env(name='OTEL_SERVICE_NAME', default='loco-api-test') %>"
    sample_ratio: 1.0
    export_timeout_secs: 1

