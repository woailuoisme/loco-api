{{- if .Values.secret.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "loco-api.fullname" . }}
  labels:
    {{- include "loco-api.labels" . | nindent 4 }}
type: {{ .Values.secret.type | default "Opaque" }}
stringData:
  {{- toYaml .Values.secret.stringData | nindent 2 }}
{{- end }}
