# loco-api：main 分支仅网页手动触发；v* 标签自动发布 镜像 + Chart + Release
# 运行时 target/release/locos（入口 start，端口 5150）；按钮见 .cnb/web_trigger.yml
main:
  web_trigger_amd64: &build_amd64
    - services:
        - docker
      stages:
        - name: Build and push image (amd64)
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"

            docker buildx build \
              --platform linux/amd64 \
              --cache-from "type=registry,ref=${REGISTRY}:cache-amd64" \
              --cache-to "type=registry,ref=${REGISTRY}:cache-amd64,mode=max,image-manifest=true,oci-mediatypes=true" \
              -f Dockerfile \
              -t "${REGISTRY}:latest" \
              --push .

  web_trigger_multi:
    - services:
        - docker
      stages:
        - name: Build and push image (amd64 + arm64)
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"

            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --cache-from "type=registry,ref=${REGISTRY}:cache-multi" \
              --cache-to "type=registry,ref=${REGISTRY}:cache-multi,mode=max,image-manifest=true,oci-mediatypes=true" \
              -f Dockerfile \
              -t "${REGISTRY}:latest" \
              -t "${REGISTRY}:multi" \
              --push .

  # 默认网页按钮回落到 amd64
  web_trigger: *build_amd64

# 发版顺序对齐 .github/workflows/release.yaml
v*:
  tag_push:
    - services:
        - docker
      stages:
        - name: Build and push release image
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VERSION="${CNB_BRANCH##*/}"

            docker buildx build \
              --platform linux/amd64 \
              --cache-from "type=registry,ref=${REGISTRY}:cache-amd64" \
              --cache-to "type=registry,ref=${REGISTRY}:cache-amd64,mode=max,image-manifest=true,oci-mediatypes=true" \
              -f Dockerfile \
              -t "${REGISTRY}:latest" \
              -t "${REGISTRY}:${VERSION}" \
              --push .

        # stages 下是 Job：镜像写 image:，写 docker: + 内层 stages 会被静默忽略
        - name: Helm chart package & push
          image: alpine/helm:4
          script: |
            set -euo pipefail
            VERSION="${CNB_BRANCH##*/}"
            CHART_VERSION="${VERSION#v}"
            HELM_REGISTRY="${CNB_HELM_REGISTRY:-helm.cnb.cool}"
            TARGET_NAMESPACE="${CNB_GROUP_SLUG_LOWERCASE:-${CNB_REPO_SLUG_LOWERCASE}}"

            helm lint helm/loco-api
            echo "${CNB_TOKEN}" | helm registry login "${HELM_REGISTRY}" -u "${CNB_TOKEN_USER_NAME:-cnb}" --password-stdin
            mkdir -p dist
            helm package helm/loco-api --version "${CHART_VERSION}" --app-version "${VERSION}" -d dist
            helm push "dist/loco-api-${CHART_VERSION}.tgz" "oci://${HELM_REGISTRY}/${TARGET_NAMESPACE}"

        # jobs 数组为串行：保证 RELEASE_NOTES.md 先生成
        - name: Changelog & Release
          jobs:
            - name: Generate Changelog with git-cliff
              image: orhunp/git-cliff:latest
              script: |
                set -eu
                git-cliff --latest --strip header -o RELEASE_NOTES.md
            - name: Create CNB Release
              type: git:release
              options:
                title: "Release ${CNB_BRANCH}"
                descriptionFromFile: RELEASE_NOTES.md
                latest: true
