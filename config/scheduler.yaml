# Loco 定时任务调度器配置 (scheduler.yaml)
#
# 运行方式：
#   `cargo loco scheduler` 独立以守护进程运行
# 任务说明：
#   - clean_expired_tokens: 每天凌晨 03:00 自动清理 verification 表中的过期校验码与失效 Token
#   - health_check: 每小时执行一次服务健康检查并记录系统状态

output: stdout

jobs:
  health_check:
    run: "health_check"
    schedule: "run every 1 hour"
    output: silent
    tags: ['maintenance', 'health']

  clean_expired_tokens:
    run: "clean_expired_tokens"
    schedule: "at 03:00 am"
    output: silent
    tags: ['maintenance', 'cleanup']

