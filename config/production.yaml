# Loco 应用生产环境配置文件 (production.yaml)
#
# 生产环境安全铁律：
# 所有连接串、密钥、密码均不设默认值，未显式注入环境变量时拒绝启动，杜绝静默回退到弱密码或本地数据库。

# 1. 日志与链路追踪配置 (Logger)
logger:
  enable: true
  # 生产环境关闭美化回溯以提升性能并避免向日志聚合器暴露源码路径
  pretty_backtrace: false
  level: <%= get_env(name="LOG_LEVEL", default="info") %>
  # 覆盖日志过滤器 (屏蔽启动时冗长的路由与中间件注册日志，亦可通过 LOGGER_OVERRIDE_FILTER 覆写)
  override_filter: <%= get_env(name="LOGGER_OVERRIDE_FILTER", default="info,loco_rs::controller::app_routes=warn") %>
  # json 格式便于 Loki, Datadog, ELK 等日志收集系统结构化索引
  format: json
  file_appender:
    enable: true
    non_blocking: true
    level: info
    format: json
    rotation: daily
    dir: <%= get_env(name="LOG_DIR", default="./storages/logs") %>
    filename_prefix: loco-api
    filename_suffix: log
    max_log_files: 30

# 2. Web 服务与中间件配置 (Web Server & Middlewares)
server:
  port: <%= get_env(name="APP_PORT", default="5150") %>
  # 0.0.0.0 支持容器环境内部端口对外暴露
  binding: <%= get_env(name="APP_BINDING", default="0.0.0.0") %>
  host: <%= get_env(name="APP_URL") %>
  ident: ""
  middlewares:
    logger:
      enable: true
    cors:
      enable: true
      allow_origins:
        - "<%= get_env(name='CORS_ALLOWED_ORIGINS', default='*') %>"
      allow_headers:
        - "content-type"
        - "authorization"
        - "accept"
      allow_methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "OPTIONS"
    compression:
      enable: true
    limit_payload:
      enable: true
      body_limit: "10mb"
    etag:
      enable: true
    catch_panic:
      enable: true
    request_id:
      enable: true
    remote_ip:
      enable: true
    timeout_request:
      enable: true
      timeout: 10000
    secure_headers:
      enable: true

# 3. 后台任务队列模式 (生产环境使用分布式高可用持久化队列)
workers:
  mode: BackgroundQueue

# 4. Redis 队列配置
queue:
  kind: Redis
  uri: <%= get_env(name="REDIS_URL") %>
  dangerously_flush: false

# 5. 生产邮件服务配置 (SMTP SSL/TLS)
mailer:
  smtp:
    enable: true
    host: <%= get_env(name="MAIL_HOST") %>
    port: <%= get_env(name="MAIL_PORT", default="587") %>
    secure: <%= get_env(name="MAIL_SECURE", default="false") %>
    auth:
      user: <%= get_env(name="MAIL_USERNAME") %>
      password: <%= get_env(name="MAIL_PASSWORD") %>

# 6. 对象存储配置 (S3 兼容协议生产存储)
storage:
  kind: Aws
  bucket: <%= get_env(name="AWS_BUCKET") %>
  region: <%= get_env(name="AWS_DEFAULT_REGION", default="garage") %>
  endpoint: <%= get_env(name="AWS_ENDPOINT") %>
  access_key_id: <%= get_env(name="AWS_ACCESS_KEY_ID") %>
  secret_access_key: <%= get_env(name="AWS_SECRET_ACCESS_KEY") %>

# 7. 生产数据库配置 (PostgreSQL 连接池)
database:
  uri: <%= get_env(name="DB_URL") %>
  enable_logging: false
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="5000") %>
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="30000") %>
  min_connections: <%= get_env(name="DB_MIN_CONNECTIONS", default="5") %>
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="50") %>
  auto_migrate: false
  dangerously_truncate: false
  dangerously_recreate: false

# 8. 生产 JWT 身份认证配置
auth:
  jwt:
    secret: <%= get_env(name="JWT_SECRET") %>
    expiration: <%= get_env(name="JWT_TTL", default="604800") %>

# 9. 生产缓存配置 (Redis 共享缓存)
cache:
  kind: Redis
  uri: <%= get_env(name="CACHE_URL") %>
  max_size: <%= get_env(name="CACHE_MAX_SIZE", default="50") %>

# 10. 生产第三方集成设置
settings:
  oauth2:
    google:
      client_id: <%= get_env(name="GOOGLE_CLIENT_ID", default="") %>
      client_secret: <%= get_env(name="GOOGLE_CLIENT_SECRET", default="") %>
  media:
    driver: <%= get_env(name="MEDIA_DRIVER", default="direct") %>
    base_url: "<%= get_env(name='MEDIA_BASE_URL', default='') %>"
    imgproxy:
      endpoint: "<%= get_env(name='IMGPROXY_ENDPOINT', default='') %>"
      key: "<%= get_env(name='IMGPROXY_KEY', default='') %>"
      salt: "<%= get_env(name='IMGPROXY_SALT', default='') %>"
    cloudflare:
      domain: "<%= get_env(name='CF_IMAGE_DOMAIN', default='') %>"
    aliyun_oss:
      bucket: "<%= get_env(name='ALIYUN_OSS_BUCKET', default='') %>"
      endpoint: "<%= get_env(name='ALIYUN_OSS_ENDPOINT', default='') %>"
  telegram:
    bot_token: "<%= get_env(name='TELEGRAM_BOT_TOKEN', default='') %>"
    chat_id: "<%= get_env(name='TELEGRAM_CHAT_ID', default='') %>"
    api_url: "<%= get_env(name='TELEGRAM_API_URL', default='https://api.telegram.org') %>"
  scout:
    meilisearch:
      host: "<%= get_env(name='MEILISEARCH_HOST', default='') %>"
      key: "<%= get_env(name='MEILISEARCH_KEY', default='') %>"
      prefix: "<%= get_env(name='MEILISEARCH_INDEX_PREFIX', default='loco_prod_') %>"
  system:
    machine_id: <%= get_env(name="MACHINE_ID", default="1") %>
  centrifugo:
    api_endpoint: "<%= get_env(name='CENTRIFUGO_API_ENDPOINT', default='http://centrifugo:8000/api') %>"
    api_key: "<%= get_env(name='CENTRIFUGO_API_KEY', default='') %>"
    token_hmac_secret: "<%= get_env(name='CENTRIFUGO_TOKEN_HMAC_SECRET', default='') %>"
    token_audience: "<%= get_env(name='CENTRIFUGO_TOKEN_AUDIENCE', default='centrifugo') %>"
    ws_url: "<%= get_env(name='CENTRIFUGO_WS_URL', default='') %>"
    token_ttl_secs: <%= get_env(name="CENTRIFUGO_TOKEN_TTL_SECS", default="86400") %>
  opentelemetry:
    enabled: <%= get_env(name="OTEL_ENABLED", default="false") %>
    endpoint: "<%= get_env(name='OTEL_EXPORTER_OTLP_ENDPOINT', default='http://otel-collector:4318') %>"
    service_name: "<%= get_env(name='OTEL_SERVICE_NAME', default='loco-api-prod') %>"
    sample_ratio: <%= get_env(name="OTEL_TRACES_SAMPLER_ARG", default="1.0") %>
    export_timeout_secs: <%= get_env(name="OTEL_EXPORT_TIMEOUT_SECS", default="5") %>

# 11. 定时任务调度器配置 (Scheduler)
scheduler:
  output: stdout
  jobs:
    health_check:
      run: "health:check"
      schedule: "run every 1 hour"
      output: silent
      tags: ['maintenance', 'health']

    clean_expired_tokens:
      run: "clean_expired_tokens"
      schedule: "at 03:00 am"
      output: silent
      tags: ['maintenance', 'cleanup']


