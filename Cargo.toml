[workspace]

[package]
name = "loco-api"
version = "0.2.0"
edition = "2024"
publish = false
default-run = "locos"

[[bin]]
name = "locos"
path = "src/bin/main.rs"
required-features = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[workspace.dependencies]
loco-rs = { version = "1.3", default-features = false }

[dependencies]
# 1. 框架与运行时
loco-rs = { workspace = true, features = [
  "storage_aws_s3",
  "cache_inmem",
  "cache_redis",
  "worker_redis",
  "worker",
  "auth",
  "cli",
  "with-db",
  "db-postgres",
  "compression",
  "generators",
  "mailer",
] }
opendal = { version = "0.58", default-features = false, features = [
  "auto-register-services",
  "http-transport-reqwest",
] }
tokio = { version = "1.54", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
  "signal",
  "fs",
  "io-util",
] }
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio-util = { version = "0.7" }
async-trait = { version = "0.1" }
governor = { version = "0.10", features = ["jitter", "quanta"] }
tower_governor = { version = "0.8", features = ["tracing"] }
totp-rs = { version = "6.0", features = ["otpauth", "gen_secret"] }
url = { version = "2" }
jsonwebtoken = { version = "10", features = ["use_pem"] }

# 2. 数据库与迁移
migration = { path = "migration" }
sea-orm = { version = "2.0", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }

# 3. 网络与检索
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "json",
  "form",
  "stream",
  "multipart",
] }
meilisearch-sdk = { version = "0.33", default-features = false, features = [
  "reqwest",
  "tls",
  "jwt_rust_crypto",
] }
mime_guess = { version = "2" }
bytes = { version = "1", features = ["serde"] }

# 4. 序列化、校验与数据类型
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
validator = { version = "0.20", features = ["derive"] }
thiserror = { version = "2" }
color-eyre = { version = "0.6", features = ["tracing-error", "issue-url"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.29", features = ["v4", "v7", "serde"] }
secrecy = { version = "0.10.3", features = ["serde"] }
base64 = { version = "0.23" }
rand = { version = "0.10", features = ["serde"] }
rust-i18n = { version = "4.2.4" }
sha2 = { version = "0.11" }
hmac = { version = "0.13" }
hex = { version = "0.4" }
dotenvy = "0.15"

# 5. CLI
inquire = { version = "0.9", features = ["date", "editor", "macros"] }

# 6. 日志与可观测性
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = [
  "rt-tokio",
  "trace",
  "metrics",
  "logs",
] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
  "http-proto",
  "reqwest-rustls",
  "trace",
  "metrics",
  "logs",
] }
tracing-opentelemetry = { version = "0.34", default-features = false, features = ["metrics"] }
opentelemetry-appender-tracing = { version = "0.33", default-features = false, features = ["experimental_metadata_attributes"] }
opentelemetry-semantic-conventions = { version = "0.33" }
regex = { version = "1.13" }

# 7. 表格、图像与二维码 (src/common)
calamine = { version = "0.38", features = ["chrono"] }
rust_xlsxwriter = { version = "0.102", features = [
  "constant_memory",
  "chrono",
  "serde",
] }
image = { version = "0.25", features = ["serde", "color_quant"] }
qrcode = { version = "0.14" }

# 8. API 文档与前端契约
utoipa = { version = "6", features = [
  "axum_extras",
  "chrono",
  "uuid",
  "preserve_order",
  "openapi_extensions",
] }
utoipa-scalar = { version = "0.4", features = ["axum"] }
utoipa-redoc = { version = "7", features = ["axum"] }
ts-rs = { version = "12", features = ["chrono-impl", "serde-compat"] }
include_dir = { version = "0.7" }
cent = { version = "0.2.1", features = ["client", "token"] }

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing-core"] }
axum-test = "17"
serial_test = { version = "4" }
insta = { version = "1.49", features = ["filters"] }
ctor = "1.0.13"
rstest = { version = "0.28" }
tower = { version = "0.5", features = ["util"] }

[profile.dev]
debug = 1

[profile.test]
debug = 1

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = "debuginfo"
