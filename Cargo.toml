[workspace]

[package]
name = "loco-api"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "loco_api-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "1.3", default-features = false }

[dependencies]
loco-rs = { workspace = true , features = ["auth", "cli", "with-db", "cache_inmem", "worker", "db-postgres", "compression", "generators", "mailer", "worker_redis"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.11" }
migration = { path = "migration" }
sea-orm = { version = "2.0", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4" }
validator = { version = "0.20" }
uuid = { version = "1.6", features = ["v4"] }
# ts-rs derives the TypeScript bindings for the `dtos` (the typed JSON API
# contract). Present for every db app; the SPA frontend consumes the exports,
# and a headless app can still emit them for external consumers.
ts-rs = { version = "12", features = ["chrono-impl", "serde-compat"] }
include_dir = { version = "0.7" }

[[bin]]
name = "loco_api-cli"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
# `testing-core` leaves out the HTML selector assertions (`assert_css_*`);
# switch to `testing` to get them, at the cost of a slower first `cargo test`.
loco-rs = { workspace = true, features = ["testing-core"] }
serial_test = { version = "3.1.1" }
insta = { version = "1.34", features = ["filters"] }

# Dependencies build without debug info. Your own crates keep it, so
# breakpoints and backtraces in app code work as before; this roughly halves
# the size of target/.
[profile.dev.package."*"]
debug = false
